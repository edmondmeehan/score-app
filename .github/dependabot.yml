# Weekly check for security fixes in the app's code libraries. GitHub opens a pull request when one is available.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (like Next.js 15 → 16) change how the app works; we do those by hand, not automatically.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
