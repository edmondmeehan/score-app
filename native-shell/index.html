<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScoreDate</title>
<style>
  html,body{margin:0;height:100%;background:#0B0B0C;color:#F2F0EB;font-family:-apple-system,system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;box-sizing:border-box}
  .mark{width:72px;height:72px;border-radius:18px;background:#131315;border:1px solid #5C4C2A;display:grid;place-items:center;font:400 44px Georgia,serif;color:#C9A961}
  h1{font:400 30px Georgia,serif;margin:6px 0 0}
  p{margin:0;color:#B4B2AC;font-size:15px;line-height:1.5;max-width:300px}
  button{margin-top:10px;min-height:50px;padding:0 28px;border:0;border-radius:999px;background:#C9A961;color:#0B0B0C;font:600 16px -apple-system,system-ui,sans-serif}
</style></head>
<body><main>
  <div class="mark">S</div>
  <h1>You’re offline</h1>
  <p>ScoreDate needs an internet connection. Check your Wi-Fi or cellular data and try again.</p>
  <button onclick="location.href='https://www.scoredate.app/join'">Try again</button>
</main></body></html>
